name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

# A new push to a PR branch cancels the in-flight run instead of queueing it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # Pinned to a commit SHA (supply-chain hardening, not a mutable tag).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 22
          cache: npm

      # npm 10.x crashes with an arborist peer-resolution error ("Cannot read
      # properties of null (reading 'edgesOut')") on the vite >= 8.2.4 dependency
      # graph. npm 11 resolves it. package.json pins `packageManager` and
      # `engines.npm >= 11` for the same reason.
      - name: Use npm 11
        run: npm install -g npm@11.21.1

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Dependency vulnerability audit (audit L9 / H-13).
      #
      # The BLOCKING gate audits the PRODUCTION dependency tree — the surface
      # that actually ships in the browser bundle. `tailwindcss-animate` used
      # to live in `dependencies`, which dragged tailwind -> postcss ->
      # source-map-js into the shipped tree and turned this gate red; it is now
      # a devDependency and the production tree audits clean.
      - name: Dependency audit (production tree)
        run: npm audit --omit=dev --audit-level=high

      # The dev tree still carries advisories with NO published fix: the
      # `braces` advisory (GHSA-grs4-h8ph-pqhp family) has no patched release
      # at all — braces 3.0.3 is the latest and is the vulnerable version — and
      # it reaches us through tailwindcss 3.x -> chokidar -> micromatch ->
      # braces. Clearing it requires a Tailwind v4 major migration, which is a
      # separate, larger change. This step reports the full tree so the
      # picture stays visible in CI logs without blocking on an advisory that
      # cannot be patched.
      - name: Dependency audit (full tree — informational)
        continue-on-error: true
        run: npm audit --audit-level=high

      # Real typecheck - bare `tsc --noEmit` on the solution-style root
      # tsconfig checks zero files and always passes.
      - name: Typecheck
        run: |
          npx tsc -p tsconfig.app.json --noEmit
          npx tsc -p tsconfig.node.json --noEmit

      - name: Unit tests
        run: npx vitest run

      # `npm run build` also runs the `postbuild` hook, which generates
      # dist/_headers and then runs scripts/verify-prod-build.mjs. That
      # verifier is what turns a production bundle that crashes at module load
      # (audit C-1) into a BUILD failure instead of a deployed outage.
      - name: Build
        run: npm run build

      - name: Production bundle verification
        run: npm run verify:build

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: medicomatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Use npm 11
        run: npm install -g npm@11.21.1

      - name: Install dependencies
        run: npm ci

      # Server lint: syntax-check every module + suite, not just index.mjs.
      - name: Syntax check (all server modules + tests)
        run: |
          set -e
          for f in src/*.mjs tests/*.mjs; do node --check "$f"; done

      # Server dependency vulnerability audit (audit L9). The server tree has
      # no devDependencies, so the full tree IS the production tree.
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Smoke test (auth + payments + entitlements, simulation mode)
        run: node tests/smoke.mjs

      - name: Regression fixes suite (PoW, coupons, admin sync)
        run: node tests/regression-fixes.mjs

      # Production boot matrix (audit M-43). The suites above all run with
      # NODE_ENV=test, so the fail-closed production boot validation in
      # server/src/index.mjs was never executed by any gate. This asserts that
      # a misconfigured production boot REFUSES to start for every reason the
      # boot matrix lists.
      - name: Production boot refuses to start when misconfigured
        run: node tests/production-boot.mjs

      - name: Wired-backend e2e (Postgres service)
        env:
          TEST_DATABASE_URL: postgres://postgres:testpass@localhost:5432/medicomatch_test
        run: node tests/smoke-db.mjs
